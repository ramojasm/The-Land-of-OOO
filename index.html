<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore the strange and wonderful citizens of Ooo.">
  <title>Atlas of Ooo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="./" aria-label="Atlas of Ooo home">
      <span class="brand-mark">✦</span>
      <span>ATLAS<span class="brand-accent">/</span>OOO</span>
    </a>
    <div class="header-note">FIELD GUIDE · FANDOM DATABASE</div>
  </header>

  <main>
    <section class="explorer" aria-labelledby="explorer-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">01 / Explore</p>
          <h2 id="explorer-title">The inhabitants</h2>
        </div>
        <button class="random-button" id="random-button" type="button"><span>↯</span> Surprise me</button>
      </div>

      <div class="controls">
        <label class="search-box">
          <span class="sr-only">Search the atlas</span>
          <span aria-hidden="true">⌕</span>
          <input id="search-input" type="search" placeholder="Search names, species, places..." autocomplete="off">
        </label>
        <div class="filter-group" id="filter-group" aria-label="Filter by category">
          <button class="filter-button is-active" type="button" data-filter="all">All</button>
        </div>
      </div>

      <div class="status-row">
        <p id="result-count" class="result-count">Connecting to the atlas...</p>
        <button class="retry-button" id="retry-button" type="button">↻ Retry connection</button>
      </div>
      <div id="status-message" class="status-message" role="status" aria-live="polite"></div>
      <div id="card-grid" class="card-grid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="footer">
    <span>ATLAS/OOO</span>
    <span id="last-updated">Waiting for a signal from Ooo</span>
    <span id="record-label">300 RECORDS</span>
  </footer>

  <dialog id="detail-dialog" class="detail-dialog">
    <button class="dialog-close" id="dialog-close" type="button" aria-label="Close details">×</button>
    <div id="dialog-content"></div>
  </dialog>
  <div id="dialog-backdrop" class="dialog-backdrop" hidden></div>
  <script src="chardle-data.js?v=20261004"></script>
  <script src="script.js?v=20261029-images"></script>
</body>
</html>
